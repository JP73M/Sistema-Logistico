<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial</title>

    <link rel="icon" href="../assets/img/Logo_D_White.png">

    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <link rel="stylesheet" href="../assets/css/historial.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

           <div class="logo_sidebar">
                <img src="../assets/img/Logo-Complete-Blue.png" alt="">
           </div>

           <nav>

             <a class="active" href="dashboard.html"><img src="../assets/img/icons/Home.png" alt="">Dashboard</a>

             <a class="active" href="historial.html" class="nav-link"><img src="../assets/img/icons/Docs.png" alt="">Historial</a>

             <a class="active" href="manifiesto.html"><img src="../assets/img/icons/Truck.png" alt="">Manifiestos</a>

             <a class="active" href=""><img src="../assets/icons/user.png" alt="">Usuarios</a>

             <a class="active" href=""><img src="../assets/img/icons/Report.png" alt="">Reportes</a>

             <a class="active" href=""><img src="../assets/img/icons/Configuration.png" alt="">Configuracion</a>
           </nav>

           <div class="logout">
                <a class="active" onclick="logout()"><img src="../assets/img/icons/Logout.png" alt="">Cerrar sesion</a>
           </div>

            <span class="span">
                Versión 1.0.0
            </span>

        </aside>



        <main class="content">

            <div class="historial-container">

                <!-- HEADER -->
                <div class="page-header">
                    <div>
                    <h1>Historial</h1>
                    <p>Consulta de lotes procesados</p>
                    </div>
                </div>

                <!-- CENTRO DE BÚSQUEDA -->
                <div class="search-card">

                    <div class="search-header">
                    <h3>Centro de búsqueda</h3>
                    <br>
                    </div>

                    <div class="search-bar">

                        <input 
                            type="text" 
                            id="inputBusqueda" 
                            placeholder="🔍 Buscar guía, manifiesto, casillero o cliente..."
                        >

                        <div id="filtroFechas" class="filtro-fechas">

                            <div class="campo-fecha">
                                <label for="fechaDesde">Desde</label>
                                <input type="date" id="fechaDesde">
                            </div>

                            <div class="campo-fecha">
                                <label for="fechaHasta">Hasta</label>
                                <input type="date" id="fechaHasta">
                            </div>

                        </div>

                        <button class="btn-primary" id="btnBuscar">
                            Buscar
                        </button>

                        <button class="btn-secondary" id="btnLimpiar">
                            Limpiar
                        </button>

                    </div>

                    <br>

                    <!-- FILTROS -->
                    <div class="filters">

                    <button class="filter active">Todas</button>
                    <button class="filter">Guías</button>
                    <button class="filter">TRK</button>
                    <button class="filter">Manifiestos</button>
                    <button class="filter">Casilleros</button>
                    <button class="filter">Clientes</button>
                    <button class="filter" id="btn-fecha">Fechas</button>

                    </div>

                </div>

                <section class="table-card">

                    <div class="table-header">

                        <div>

                            <h3>Resultados de búsqueda</h3>

                            <span id="lblResultados">
                                Mostrando 0 registros
                            </span>

                        </div>

                       

                    </div>

                    <div class="table-container">

                        <table>

                            <thead>

                                <tr>

                                    <th>Lote</th>

                                    <th>Guía</th>

                                    <th>TRK</th>

                                    <th>Casillero</th>

                                    <th>Cliente</th>

                                    <th>Peso</th>

                                    <th>Servicio</th>

                                    <th>Manifiesto</th>

                                    <th>Fecha</th>

                                </tr>

                            </thead>

                            <tbody id="tablaHistorial">

                                

                            </tbody>

                        </table>

                    </div>

                </section>

            </div>
        </main>

    </div>

    <script src="../assets/js/historial.js"></script>

</body>

</html>
